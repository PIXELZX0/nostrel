name: docker

# Builds the relay image for several architectures and publishes it to GHCR.
#
# Two channels:
#
#   push to main    -> latest-test, test-<UTC timestamp>
#   push tag v1.2.3 -> latest, latest-rc, rc-1.2.3
#
# Publishing a GitHub release creates its tag, which is what fires the second
# one — there is no separate release trigger, so a release never starts two runs
# racing to write the same tags.
#
# Each architecture is built on a runner of that architecture where GitHub has
# one, so the Go toolchain and cgo run natively. That matters here: the event
# store needs cgo (mattn/go-sqlite3), and compiling it under QEMU takes minutes
# instead of seconds. Only the platforms without a native runner are emulated.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test ./...

  build:
    name: ${{ matrix.platform }}
    needs: test
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          # GitHub has no 32-bit runner, so this one is built under QEMU and is
          # by far the slowest of the three. Delete this entry if 32-bit ARM
          # (Raspberry Pi 2/3, older SBCs) is not worth the CI time; add
          # linux/386 the same way if 32-bit x86 ever is.
          - platform: linux/arm/v7
            runner: ubuntu-24.04
            emulated: true

    steps:
      - uses: actions/checkout@v7

      # GHCR rejects uppercase repository names, and this one has them.
      - name: Resolve image name
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "PLATFORM_TAG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-qemu-action@v4
        if: matrix.emulated

      - uses: docker/setup-buildx-action@v4

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture is pushed by digest only; the merge job below is what
      # turns them into one tagged, multi-architecture image.
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ env.PLATFORM_TAG }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_TAG }}
          # A pull request only proves the image still builds, so nothing is
          # exported; pushing by digest is for the real publish path.
          outputs: >-
            ${{ github.event_name == 'pull_request'
                && 'type=cacheonly'
                || format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) }}

      - name: Save digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ env.PLATFORM_TAG }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    name: publish manifest
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      # main   -> latest-test and test-<UTC timestamp>
      # v1.2.3 -> latest, latest-rc and rc-1.2.3
      #
      # The timestamp is computed here rather than in the per-architecture jobs,
      # so every architecture of one build lands under the same tag. Times are
      # UTC; swap the format for {{date 'X'}} if a unix epoch reads better.
      #
      # flavor latest=false turns off the automatic "latest"; it is listed
      # explicitly below instead, so only a release ever moves it and a push to
      # main cannot.
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=latest-test,enable={{is_default_branch}}
            type=raw,value=test-{{date 'YYYY-MM-DD-HHmmss'}},enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest-rc,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}},prefix=rc-

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${IMAGE}:${VERSION}"
        env:
          VERSION: ${{ steps.meta.outputs.version }}
